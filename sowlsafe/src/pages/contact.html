<!--meta {"title": "Contact", "nav": "contact", "description": "Demande d'audit, de bilan personnalisé ou simple question : écrivez-nous."} -->
<section class="page-hero band-night">
  <div class="wrap hero-copy">
    <p class="eyebrow">Contact</p>
    <h1>Parlons de votre situation</h1>
    <p class="lead">Audit, bilan personnalisé ou simple question : nous répondons sous 48 heures ouvrées.</p>
  </div>
</section>
<section class="section">
  <div class="wrap">
    <form class="form" data-form="contact" data-success="Merci, votre message a bien été envoyé. Nous revenons vers vous sous 48 heures ouvrées.">
      <fieldset class="field">
        <legend>Vous êtes</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="profil" value="particulier" id="c-particulier" checked><span>Un particulier</span></label>
          <label class="chip"><input type="radio" name="profil" value="entreprise" id="c-entreprise"><span>Une entreprise ou organisation</span></label>
        </div>
      </fieldset>
      <div class="form-row">
        <div class="field"><label for="c-nom">Nom et prénom</label><input id="c-nom" name="nom" type="text" required autocomplete="name"></div>
        <div class="field"><label for="c-email">E-mail</label><input id="c-email" name="email" type="email" required autocomplete="email"></div>
      </div>
      <div class="field"><label for="c-message">Votre message</label><textarea id="c-message" name="message" required placeholder="Décrivez votre besoin en quelques lignes."></textarea></div>
      <label class="check" for="c-rgpd"><input type="checkbox" id="c-rgpd" name="consentement" required><span>J'accepte que mes informations soient utilisées pour répondre à ma demande (<a href="{{pre}}mentions-legales.html#confidentialite">confidentialité</a>).</span></label>
      <div><button class="btn" type="submit">Envoyer</button></div>
      <p class="notice" data-form-message hidden role="status"></p>
    </form>
  </div>
</section>
